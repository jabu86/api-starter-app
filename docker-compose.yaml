
services:
  postgres:
    image: 'postgres:17'
    container_name: 'postgres_db'
    volumes:
      - ecommerce_data:/var/lib/postgresql/data
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  backend:
    build: ./api
    container_name: e-shop-api
    ports:
      - '8000:8000'
    volumes:
      - logs:/app/logs
      - productImages:/app/public/images/products
      - brandImages:/app/public/images/brands
      - profileImages:/app/public/images/profile
      - ./api:/app
      - /app/node_modules
    env_file:
      - ./api/.env
    depends_on:
      postgres:
        condition: service_healthy 
  frontend:
    build: ./react-frontend
    container_name: e-shop
    ports:
      - '5173:5173'
    volumes:
      - ./react-frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - backend
volumes:
  ecommerce_data:
  logs:
  productImages:
  brandImages:
  profileImages: